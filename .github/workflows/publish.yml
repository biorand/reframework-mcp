name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

concurrency:
  group: npm-publish
  cancel-in-progress: false

defaults:
  run:
    working-directory: ts

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not match ts/package.json version '$version'."
            exit 1
          fi
          echo "Publishing $version"

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Alternative to the NPM_TOKEN secret: configure npm trusted publishing
        # for this package (npmjs.com -> package settings -> Trusted Publisher)
        # with the repository and this workflow file name, then remove the
        # NODE_AUTH_TOKEN env entry. Provenance already works via id-token.
